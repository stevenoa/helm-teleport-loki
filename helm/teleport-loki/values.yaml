# ==============================================================================
# teleport-loki Helm chart — values.yaml
# ==============================================================================

# -- Kubernetes namespace to deploy into (created if it doesn't exist)
namespace: teleport-loki

# ------------------------------------------------------------------------------
# Teleport connection
# ------------------------------------------------------------------------------
teleport:
  # -- Teleport cluster address, e.g. your-cluster.example.com:443
  addr: ""
  # -- Start streaming from this cursor position (leave blank for latest)
  startTime: ""

# ------------------------------------------------------------------------------
# Grafana Loki
# ------------------------------------------------------------------------------
loki:
  # -- Loki push URL — use the gateway service if deployed via the grafana/loki chart
  url: "http://loki-gateway.grafana.svc.cluster.local"
  # -- Loki stream labels attached to every log line (queryable in Grafana)
  labels:
    job: "teleport-audit"

# ------------------------------------------------------------------------------
# TLS secret
# Created externally by make create-tls-secret (see README).
# ------------------------------------------------------------------------------
secrets:
  # -- Secret containing the Fluentd mutual-TLS files:
  #    keys: ca.crt  client.crt  client.key  server.crt  server.key  server.key.passphrase
  tls:
    name: teleport-loki-tls
  # -- Secret containing the signed Teleport identity file (only used when tbot.enabled=false)
  identity:
    name: teleport-loki-identity

# ------------------------------------------------------------------------------
# tbot — Teleport Machine ID sidecar (recommended)
# Runs alongside the event-handler and auto-renews short-lived identity certs
# using the pod's Kubernetes ServiceAccount token (no long-lived secrets).
# Set enabled: false to use a static 1-year identity secret instead.
# ------------------------------------------------------------------------------
tbot:
  enabled: true
  image:
    repository: public.ecr.aws/gravitational/teleport-distroless
    tag: "18.9.2"
    pullPolicy: IfNotPresent
  # -- Name of the Teleport provision token (not a secret — just the token resource name in Teleport)
  joinTokenName: "event-handler-bot-join"
  # -- How often tbot renews the certificate (should be < certificateTTL / 2)
  renewalInterval: "20m"
  # -- TTL of each issued certificate
  certificateTTL: "1h"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ------------------------------------------------------------------------------
# teleport-event-handler
# ------------------------------------------------------------------------------
eventHandler:
  image:
    repository: public.ecr.aws/gravitational/teleport-plugin-event-handler
    tag: "18.9.2"
    pullPolicy: IfNotPresent

  # -- Number of replicas (keep at 1 — the handler maintains a streaming cursor)
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # -- Allowlist of audit event types to forward to Loki.
  # Empty list = forward all types (not recommended — kube.request is very high volume).
  # This list covers security-relevant events while excluding noise
  # (resize, app.session.request, app.session.chunk, session.print).
  # kube.request WAS excluded as noise too, but is included deliberately to
  # audit individual kubectl calls (incl. denials) for the nginx-k8s-access-demo -
  # watch Loki ingest volume if this becomes a problem at scale.
  types:
    # Auth & certificates
    - auth
    - cert.create
    # User & role management
    - user.create
    - user.created
    - user.update
    - user.updated
    - user.delete
    - user.deleted
    - role.create
    - role.created
    - role.update
    - role.updated
    - role.delete
    - role.deleted
    # Access requests
    - access_request.create
    - access_request.review
    - access_request.update
    - access_request.delete
    # SSH sessions
    - session.start
    - session.end
    - session.join
    - session.leave
    - session.command
    - session.disk
    - session.network
    - session.data
    - exec
    - port
    # Kubernetes API requests (individual kubectl calls, incl. denials)
    - kube.request
    # Database access
    - db.session.start
    - db.session.end
    - db.session.query
    # App access (start/end only — not app.session.request which is per-HTTP-request)
    - app.session.start
    - app.session.end
    # Windows Desktop
    - windows_desktop.session.start
    - windows_desktop.session.end
    # Security controls
    - lock.create
    - lock.delete
    - token.create
    - token.delete
    # Identity connectors
    - github.connector.create
    - github.connector.delete
    - oidc.connector.create
    - oidc.connector.delete
    - saml.connector.create
    - saml.connector.delete
    - trusted_cluster.create
    - trusted_cluster.delete
    # Machine ID / tbot
    - bot.join

  # -- Extra environment variables
  extraEnv: []

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------
# Fluentd
# ------------------------------------------------------------------------------
fluentd:
  image:
    repository: fluent/fluentd
    tag: "v1.17"
    pullPolicy: IfNotPresent

  replicaCount: 1

  # -- Port Fluentd listens on for incoming events from the event-handler
  port: 24224
  # -- Plain-HTTP monitor_agent port used for k8s liveness/readiness probes
  # (kept off the mTLS port so probes don't trigger SSL_accept warnings)
  monitorPort: 24220

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Install Loki output plugin on container start
  plugins:
    - fluent-plugin-grafana-loki

  extraEnv: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Fluentd output buffer tuning
  buffer:
    flushInterval: "10s"
    chunkLimitSize: "256m"
    queuedChunksLimitSize: 64
    totalLimitSize: "512m"
    retryMaxTimes: 72
    retryWait: "1m"
    retryMaxInterval: "1h"

  # -- Persist the Fluentd file buffer across pod restarts to prevent data loss
  persistence:
    enabled: true
    storageClass: ""   # leave blank to use cluster default
    size: 2Gi
    accessMode: ReadWriteOnce

# ------------------------------------------------------------------------------
# PersistentVolumeClaim for event-handler cursor state
# ------------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: ""   # leave blank to use cluster default
  size: 1Gi
  accessMode: ReadWriteOnce

# ------------------------------------------------------------------------------
# Version drift check (self-healing)
# Enterprise Cloud auto-upgrades the tenant's auth/proxy version without
# notice. If the pinned tbot/eventHandler image tags above fall behind, the
# event-handler can fail silently (see README: "Teleport Enterprise Cloud
# auto-upgrades break pinned client versions"). This CronJob polls the
# cluster's unauthenticated /webapi/ping endpoint, compares server_version
# against tbot.image.tag, and on drift: (1) immediately patches the live
# StatefulSet's image tags and restarts the pod, then (2) commits the same
# tag bump to values.yaml in git so a future `make upgrade` doesn't revert
# it. Slack-notifies with the outcome of both steps either way.
# ------------------------------------------------------------------------------
versionDriftCheck:
  enabled: true
  # -- Cron schedule (default: every 30 minutes)
  schedule: "*/30 * * * *"
  image:
    # alpine/git, not curlimages/curl - the git sync step needs git; curl
    # is installed at runtime via apk (see check.sh) rather than
    # maintaining a custom-built image just to bundle both.
    repository: alpine/git
    tag: "2.47.1"
    pullPolicy: IfNotPresent
  # -- GitHub repo to sync values.yaml against, as "host/owner/repo.git"
  #    (no scheme - the script prepends https://x-access-token:$TOKEN@)
  gitRepo: "github.com/stevenoa/helm-teleport-loki.git"
  # -- Path to values.yaml within the repo above
  valuesFilePath: "helm/teleport-loki/values.yaml"
  # -- Secret containing a GitHub fine-grained PAT (key: token), scoped to
  #    ONLY this repo with Contents: Read & Write permission - nothing
  #    broader. Created externally by `make create-github-secret` (see
  #    README) - never commit this token anywhere.
  githubTokenSecret:
    name: teleport-loki-github
    key: token
  # -- Secret containing the Slack webhook URL (key: url).
  #    Created externally by `make create-slack-secret` (see README).
  slackWebhookSecret:
    name: teleport-loki-slack
    key: url
  resources:
    # Higher than a plain curl job needs - apk add + git clone/commit/push
    # spike noticeably more than a bare HTTP call (OOMKilled at 32Mi in
    # testing).
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ------------------------------------------------------------------------------
# Self-healing
# The event-handler has been observed to stop exporting audit events for two
# different reasons - version drift (see above) and, separately, its own
# long-lived connection going stale after many hours of uptime even while
# tbot's identity renewal stays healthy underneath it. Both times the actual
# fix was a plain pod restart. Rather than diagnose *why* each time, this
# CronJob just checks "has any audit data flowed recently" and restarts the
# event-handler pod if not, Slack-notifying either way so there's still
# visibility if it has to fire repeatedly (which would mean a restart isn't
# actually fixing the underlying problem and a human should look).
# ------------------------------------------------------------------------------
selfHeal:
  enabled: true
  # -- Cron schedule (default: every 10 minutes - faster than the Grafana
  #    "Teleport Audit Pipeline No Data" alert's 30-minute threshold, so in
  #    the common case this fixes it before that alert would even fire)
  schedule: "*/10 * * * *"
  # -- Window checked for zero audit events. Wider than the schedule
  #    interval so consecutive checks overlap and no gap goes undetected
  #    for longer than one check interval.
  noDataWindow: "20m"
  image:
    repository: curlimages/curl
    tag: "8.11.0"
    pullPolicy: IfNotPresent
  # -- Secret containing the Slack webhook URL (key: url). Reuses the same
  #    secret as versionDriftCheck.
  slackWebhookSecret:
    name: teleport-loki-slack
    key: url
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
